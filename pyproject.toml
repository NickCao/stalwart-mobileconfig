[project]
name = "stalwart-mobileconfig"
version = "0.1.0"
description = "Generate Apple Mail and CalDAV profiles from Stalwart autoconfiguration"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
stalwart-mobileconfig = "stalwart_mobileconfig:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
